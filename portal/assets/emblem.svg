<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <!-- Simplified Ashoka Chakra / Emblem representation -->
  <circle cx="50" cy="50" r="48" fill="#003087" stroke="#FF6200" stroke-width="2"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Chakra (wheel) -->
  <circle cx="50" cy="36" r="10" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="50" cy="36" r="4" fill="white"/>
  <!-- Spokes - simplified 24 spokes of dharma wheel -->
  <g stroke="white" stroke-width="1" transform="translate(50,36)">
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-9" y1="0" x2="9" y2="0"/>
    <line x1="-6.4" y1="-6.4" x2="6.4" y2="6.4"/>
    <line x1="6.4" y1="-6.4" x2="-6.4" y2="6.4"/>
    <line x1="-8.5" y1="-3.1" x2="8.5" y2="3.1"/>
    <line x1="3.1" y1="-8.5" x2="-3.1" y2="8.5"/>
    <line x1="8.5" y1="-3.1" x2="-8.5" y2="3.1"/>
    <line x1="-3.1" y1="-8.5" x2="3.1" y2="8.5"/>
  </g>
  <!-- Lions (simplified block) -->
  <rect x="34" y="50" width="32" height="14" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="50" y="61" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="serif">🦁🦁</text>
  <!-- Base / Abacus line -->
  <rect x="28" y="66" width="44" height="3" rx="1.5" fill="rgba(255,255,255,0.4)"/>
  <!-- Satyamev Jayate text -->
  <text x="50" y="76" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="6" font-family="serif" font-weight="bold">सत्यमेव जयते</text>
  <!-- GovSahayak -->
  <text x="50" y="88" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="5.5" font-family="sans-serif" font-weight="600">GovSahayak</text>
</svg>
